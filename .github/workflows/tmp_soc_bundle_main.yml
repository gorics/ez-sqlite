name: Temporary Social Culture Bundle Main Trigger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp_soc_bundle_main.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tmp_soc_bundle/**'
      - '.github/workflows/tmp_soc_bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-soc-bundle-20260821
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip requests beautifulsoup4 pymupdf
      - name: Build
        run: python tmp_soc_bundle/build_soc_bundle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: social-culture-bundle-output
          path: tmp_soc_bundle/output/
          if-no-files-found: warn
