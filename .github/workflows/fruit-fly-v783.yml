name: Fruit Fly v783 Full Brain

on:
  push:
    branches: [fruit-fly-v783-run]
    paths:
      - '.github/workflows/fruit-fly-v783.yml'
      - 'tools/run_fly_v783_fullbrain.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-fullbrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fruit-fly-v783-run
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install numpy==1.26.4 scipy==1.13.1 pandas==2.2.3 pyarrow==17.0.0
      - name: Fetch original published model and v783 data
        shell: bash
        run: |
          set -euxo pipefail
          mkdir Drosophila_brain_model
          cd Drosophila_brain_model
          git init
          git remote add origin https://github.com/philshiu/Drosophila_brain_model.git
          git fetch --depth 1 origin 91bdd1e7dcf193f3e7ca5a8933497fcef63b7960
          git checkout FETCH_HEAD
          test "$(git rev-parse HEAD)" = "91bdd1e7dcf193f3e7ca5a8933497fcef63b7960"
          ls -lh Completeness_783.csv Connectivity_783.parquet
          echo "UPSTREAM_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Run actual 139255-neuron v783 simulation
        env:
          DROSOPHILA_MODEL_DIR: Drosophila_brain_model
        run: python -u tools/run_fly_v783_fullbrain.py
      - name: Print result
        if: always()
        run: |
          if [ -f fly_v783_result.json ]; then cat fly_v783_result.json; else echo NO_RESULT; fi
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('fly_v783_result.json') != ''
        with:
          name: fly-v783-fullbrain-result
          path: fly_v783_result.json
          retention-days: 1
